<!doctype html>
<html lang="pt-BR"><head>

<style>
body{margin:0;padding:22px;background:#F0EDE6;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:660px;}
.r{background:#F0EDE6;border:1px solid rgba(28,53,32,.14);border-radius:2px;padding:20px;}

.yr{font-family:'Poppins',sans-serif;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#5C5852;}
.cp{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:15px;color:#1A1A1A;padding-top:12px;margin-top:12px;border-top:1px solid rgba(28,53,32,.14);line-height:1.35;}
</style></head><body>
<div class="grid">
  <div class="r"><div class="au">Jonathan Shay</div><div class="yr">1994 · 2002</div><div class="cp">Fundação conceitual — Moral Injury a partir da experiência de veteranos.</div></div>
  <div class="r"><div class="au">Brett Litz</div><div class="yr">2009</div><div class="cp">Estruturação clínica — atos que violam a bússola moral do sujeito.</div></div>
</div>
