<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Marquee</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:0;background:#F0EDE6;}
.wrap{padding:40px 0;}
.m{overflow:hidden;border-top:1px solid rgba(28,53,32,.14);border-bottom:1px solid rgba(28,53,32,.14);padding:20px 0;background:#F0EDE6;}
.t{display:inline-flex;gap:48px;white-space:nowrap;animation:scroll 38s linear infinite;padding-right:48px;}
.i{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:28px;color:#1C3520;display:inline-flex;align-items:center;gap:48px;}
.i::after{content:"";width:6px;height:6px;background:#B95839;border-radius:50%;}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style></head><body>
<div class="wrap">
<div class="m"><div class="t">
  <span class="i">NR-1</span>
  <span class="i">Moral Injury</span>
  <span class="i">Medicina do trabalho</span>
  <span class="i">Integridade organizacional</span>
  <span class="i">Liderança ética</span>
  <span class="i">Empresas Íntegras</span>

  <span class="i">Medicina do trabalho</span>
  <span class="i">Integridade organizacional</span>

</div></div>
</div>
</body></html>
