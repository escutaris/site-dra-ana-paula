<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Elementos geométricos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:#F0EDE6;}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;}
.it{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:110px;justify-content:flex-end;}
.lab{font-family:'Poppins',sans-serif;font-weight:500;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#5C5852;}
.bar{width:6px;height:56px;background:#1C3520;}
.rule{width:72px;height:1px;background:#1C3520;opacity:.7;}
.tri{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:16px solid #1C3520;}
.sq{width:16px;height:16px;background:#1C3520;transform:rotate(45deg);}
.circ{width:56px;height:56px;border:1.5px solid #1C3520;border-radius:50%;}
</style></head><body>
<div class="row">
  <div class="it"><div class="bar"></div><div class="lab">Barra lateral</div></div>
  <div class="it"><div class="rule"></div><div class="lab">Linha horizontal</div></div>
  <div class="it"><div class="tri"></div><div class="lab">Triângulo</div></div>
  <div class="it"><div class="sq"></div><div class="lab">Quadrado rot.</div></div>
  <div class="it"><div class="circ"></div><div class="lab">Círculo outline</div></div>
</div>
</body></html>
