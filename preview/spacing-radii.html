<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Raios e bordas</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:#F0EDE6;}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.it{display:flex;flex-direction:column;align-items:center;gap:8px;}
.sq{width:72px;height:72px;background:#E8DDD2;border:1px solid rgba(28,53,32,.24);}
.lab{font-family:'Poppins',sans-serif;font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#1C3520;}
.val{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:12px;color:#5C5852;}
.note{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:#5C5852;margin-top:14px;text-align:center;}
</style></head><body>
<div class="row">
  <div class="it"><div class="sq" style="border-radius:0"></div><div class="lab">None</div><div class="val">0px</div></div>
  <div class="it"><div class="sq" style="border-radius:2px"></div><div class="lab">SM</div><div class="val">2px · padrão</div></div>
  <div class="it"><div class="sq" style="border-radius:4px"></div><div class="lab">MD</div><div class="val">4px · máx</div></div>
  <div class="it"><div class="sq" style="border-radius:12px;border-color:#B95839;"></div><div class="lab" style="color:#B95839">Proibido</div><div class="val">> 4px</div></div>
</div>
<div class="note">Estética editorial e retilínea. Nunca bordas suaves e amigáveis.</div>
</body></html>
