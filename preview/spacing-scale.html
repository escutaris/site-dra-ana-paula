<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Espaçamento</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#F0EDE6;}
.row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.tk{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{background:#1C3520;width:20px;}
.lab{font-family:'Poppins',sans-serif;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5C5852;}
.val{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:13px;color:#1C3520;}
</style></head><body>
<div class="row">
  <div class="tk"><div class="bar" style="height:4px"></div><div class="val">4</div><div class="lab">space-1</div></div>
  <div class="tk"><div class="bar" style="height:8px"></div><div class="val">8</div><div class="lab">space-2</div></div>
  <div class="tk"><div class="bar" style="height:16px"></div><div class="val">16</div><div class="lab">space-3</div></div>
  <div class="tk"><div class="bar" style="height:24px"></div><div class="val">24</div><div class="lab">space-4</div></div>
  <div class="tk"><div class="bar" style="height:32px"></div><div class="val">32</div><div class="lab">space-5</div></div>
  <div class="tk"><div class="bar" style="height:48px"></div><div class="val">48</div><div class="lab">space-6</div></div>
  <div class="tk"><div class="bar" style="height:64px"></div><div class="val">64</div><div class="lab">space-7</div></div>
  <div class="tk"><div class="bar" style="height:96px"></div><div class="val">96</div><div class="lab">space-8</div></div>
</div>
</body></html>
