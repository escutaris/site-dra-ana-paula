<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Paleta primária</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#F0EDE6;}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.sw{border-radius:2px;padding:14px 14px 12px;border:1px solid rgba(28,53,32,.12);min-height:118px;display:flex;flex-direction:column;justify-content:space-between;}
.chip{width:100%;height:52px;border-radius:2px;border:1px solid rgba(28,53,32,.08);}
.name{font-family:'Poppins',sans-serif;font-weight:500;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#1C3520;margin-top:10px;}
.hex{font-family:'Poppins',sans-serif;font-weight:300;font-size:12px;color:#5C5852;margin-top:2px;}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F0EDE6"></div><div><div class="name">Off-white</div><div class="hex">#F0EDE6 · fundo</div></div></div>
  <div class="sw"><div class="chip" style="background:#E8DDD2"></div><div><div class="name">Bege Areia</div><div class="hex">#E8DDD2 · cards</div></div></div>
  <div class="sw"><div class="chip" style="background:#1C3520"></div><div><div class="name">Verde-Noturno</div><div class="hex">#1C3520 · texto</div></div></div>
  <div class="sw"><div class="chip" style="background:#B95839"></div><div><div class="name">Terracota</div><div class="hex">#B95839 · CTA</div></div></div>
  <div class="sw"><div class="chip" style="background:#1A1A1A"></div><div><div class="name">Preto editorial</div><div class="hex">#1A1A1A · corpo</div></div></div>
  <div class="sw"><div class="chip" style="background:#5C5852"></div><div><div class="name">Cinza quente</div><div class="hex">#5C5852 · secundário</div></div></div>
</div>
</body></html>
