<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:#F0EDE6;display:flex;flex-direction:column;gap:18px;}
.v{display:flex;align-items:center;gap:16px;}
.block{padding:14px 18px;display:flex;flex-direction:column;line-height:1.1;border-radius:2px;}
.block.lt{background:#F0EDE6;border:1px solid rgba(28,53,32,.12);}
.block.dk{background:#1C3520;}
.wm{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:3px;font-size:15px;text-transform:uppercase;}
.lt .wm{color:#1C3520;}
.dk .wm{color:#F0EDE6;}
.dra{font-style:italic;font-weight:600;color:#B95839;text-transform:lowercase;margin-right:6px;letter-spacing:.5px;}
.tag{margin-top:8px;font-family:'Poppins',sans-serif;font-weight:500;font-size:8px;letter-spacing:.25em;text-transform:uppercase;color:#5C5852;}
.dk .tag{color:rgba(240,237,230,.7);}
.lab{font-family:'Poppins',sans-serif;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#5C5852;}
</style></head><body>
<div class="v">
  <div class="block lt"><span class="wm"><span class="dra">dra.</span>ANA PAULA TEIXEIRA</span></div>
  <span class="lab">Principal</span>
</div>
<div class="v">
  <div class="block dk"><span class="wm"><span class="dra">dra.</span>ANA PAULA TEIXEIRA</span></div>
  <span class="lab">Invertida</span>
</div>
<div class="v">
  <div class="block lt"><span class="wm"><span class="dra">dra.</span>ANA PAULA TEIXEIRA</span><span class="tag">SAÚDE MENTAL · MEDICINA DO TRABALHO</span></div>
  <span class="lab">Editorial</span>
</div>
</body></html>
