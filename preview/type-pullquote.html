<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Italic quote</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:#F0EDE6;}
.q{border-left:3px solid #B95839;padding:6px 0 6px 18px;max-width:640px;}
.qt{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:26px;line-height:1.3;color:#1C3520;margin:0;text-wrap:balance;}
.attr{display:block;margin-top:10px;font-family:'Poppins',sans-serif;font-weight:500;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#5C5852;}
</style></head><body>
<div class="q">
  <p class="qt">Isso não é liderança forte. É um sinal de risco organizacional.</p>
  <span class="attr">Dra. Ana Paula Teixeira · CRM-BA 12797</span>
</div>
</body></html>
