<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Card Clareza</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:#F0EDE6;}
.card{background:#F0EDE6;border:1px solid rgba(28,53,32,.14);border-radius:2px;padding:22px 24px;border-left:8px solid #1C3520;max-width:620px;}
.eb{display:inline-flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif;font-weight:500;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#1C3520;margin-bottom:12px;}
.eb::before{content:"";width:5px;height:5px;background:#B95839;border-radius:50%;}
.t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;color:#1C3520;margin:0 0 8px;line-height:1.2;text-wrap:balance;}
.b{font-family:'Poppins',sans-serif;font-weight:300;font-size:13px;line-height:1.65;color:#1A1A1A;margin:0;text-wrap:pretty;}
</style></head><body>
<article class="card">
  <span class="eb">Modo Clareza</span>
  <h3 class="t">Diagnóstico organizacional para NR-1</h3>
  <p class="b">Mapeamento de fatores psicossociais baseado em evidências, com entregáveis para o PGR e recomendações executivas por camada de liderança.</p>
</article>
</body></html>
