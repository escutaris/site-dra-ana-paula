<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Botões</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#F0EDE6;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:14px 24px;border:1px solid transparent;border-radius:2px;cursor:pointer;text-decoration:none;line-height:1;}
.p{background:#B95839;color:#F0EDE6;border-color:#B95839;}
.s{background:transparent;color:#1C3520;border-color:#1C3520;}
.g{background:transparent;color:#1C3520;border:0;padding:12px 0;font-size:11px;letter-spacing:.2em;}
.lab{font-family:'Poppins',sans-serif;font-weight:500;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#5C5852;margin-top:18px;}
</style></head><body>
<div class="row">
  <a href="#" class="btn p">Marcar consultoria</a>
  <a href="#" class="btn s">Ler o ensaio</a>
  <a href="#" class="btn g">Ver programa →</a>
</div>
<div class="lab">Primário · Secundário · Fantasma</div>
</body></html>
